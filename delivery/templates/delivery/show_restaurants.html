{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Restaurants</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-container">
        <h3>Your Restaurants</h3>
        
        <table>
            <thead>
                <tr>
                    <th>Restaurant Name</th>
                    <th>Picture</th>
                    <th>Cuisine</th>
                    <th>Rating</th>
                    <th>Operations</th>
                </tr>
            </thead>
            <tbody>
                {%  for r in restaurantList %}
                    <tr>
                        <td>{{ r.name }}</td>
                        <td>
                            <img src="{{ r.picture }}" alt="{{ r.name }}">
                        </td>
                        <td>{{ r.cuisine }}</td>
                        <td>⭐ {{ r.rating }}</td>
                        <td>
                            <a href="{% url 'open_update_restaurant' r.id %}">Update Info</a>
                            <br>
                            <a href="{% url 'delete_restaurant' r.id %}" style="color: #dc3545;">Delete</a>
                            <br>
                            <a href="{% url 'open_update_menu' r.id %}">Update Menu</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
</body>
</html>
