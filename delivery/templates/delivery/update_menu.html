{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-container">
        <!-- show current menu -->
        <h3>Current Menu Items</h3>
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Picture</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Vegetarian</th>
                </tr>
            </thead>
            <tbody>
                {%  for item in itemList %}
                    <tr>
                        <td>{{ item.name }}</td>
                        <td>
                            <img src="{{ item.picture }}" alt="{{ item.name }}">
                        </td>
                        <td>{{ item.description }}</td>
                        <td>₹{{ item.price }}</td>
                        <td>{{ item.vegeterian }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- add food item (form) -->
        <h2>Add New Menu Item</h2>
        <form action="{% url 'update_menu' restaurant.id %}" method="post" style="max-width: 600px;">
            {% csrf_token %}
            
            <label for="name">Item Name</label>
            <input type="text" id="name" name="name" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>

            <label for="price">Price</label>
            <input type="number" id="price" name="price" step="0.01" required>

            <label for="picture">Image URL</label>
            <input type="url" id="picture" name="picture" required>

            <label for="vegeterian" style="display: flex; align-items: center; margin-bottom: 15px;">
                <input type="checkbox" id="vegeterian" name="vegeterian" style="width: auto; margin-right: 10px; margin-bottom: 0;">
                <span>Vegetarian</span>
            </label>

            <button type="submit">Add Item</button>
        </form>
    </div>
</body>
</html>
