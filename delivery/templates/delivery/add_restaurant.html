{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Restaurant</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <form action="{% url 'add_restaurant' %}" method="post">
        <h3>Add New Restaurant</h3>
        {% csrf_token %}
        
        <label for="name">Restaurant Name</label>
        <input type="text" id="name" name="name" required>
        
        <label for="picture">Picture URL</label>
        <input type="url" id="picture" name="picture" required>
        
        <label for="cuisine">Cuisine</label>
        <input type="text" id="cuisine" name="cuisine" required>
        
        <label for="rating">Rating</label>
        <input type="number" id="rating" name="rating" min="0" max="5" step="0.5" required>
        
        <button type="submit">Add Restaurant</button>
    </form>
</body>
</html>
